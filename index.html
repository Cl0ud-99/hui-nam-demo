<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>回南 · HUI NAM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#0a0908; --paper:#d8cfc0; --dim:#8a8175; --red:#8e1d17; --red-bright:#c8322a;
    --serif:"Songti SC","SimSun","Noto Serif SC",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:var(--sans)}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- film overlay ---------- */
  #grade{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,.38) 100%),
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,.03) 50%);
    background-size:100% 100%, 100% 4px; mix-blend-mode:multiply; opacity:.55}
  #grain{position:fixed;inset:-50%;pointer-events:none;z-index:6;opacity:.028;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.9'/></svg>");
    animation:grainShift .9s steps(3) infinite}
  @keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}

  /* ---------- menu ---------- */
  #menu{position:fixed;inset:0;z-index:20;display:flex;align-items:stretch;
    background:linear-gradient(90deg, rgba(4,4,4,.97) 0%, rgba(4,4,4,.86) 38%, rgba(4,4,4,.25) 70%, rgba(4,4,4,.55) 100%);
    transition:opacity .9s ease}
  #menu.hide{opacity:0;pointer-events:none}
  #menu .left{width:min(560px,52vw);padding:9vh 0 7vh 7vw;display:flex;flex-direction:column;justify-content:space-between}
  .titlewrap{display:flex;gap:26px;align-items:flex-start}
  .vtitle{writing-mode:vertical-rl;font-family:var(--serif);font-weight:600;
    font-size:clamp(64px,8.6vw,132px);letter-spacing:.06em;line-height:1.02;color:#e8dfcf;
    text-shadow:0 0 40px rgba(200,50,40,.16), 0 2px 0 #000}
  .titlemeta{padding-top:6px}
  .titlemeta .en{font-family:var(--sans);letter-spacing:.42em;font-size:12px;color:#a99f90;margin-bottom:14px}
  .titlemeta .rule{width:34px;height:1px;background:#6c2b25;margin:12px 0 16px}
  .titlemeta .sub{font-family:var(--serif);font-size:15px;line-height:2;color:#8f8677;letter-spacing:.18em}
  .titlemeta .sub b{color:#b8443a;font-weight:400}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:4vh}
  nav button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:18px;padding:11px 0;
    font-family:var(--serif);font-size:26px;letter-spacing:.3em;color:#9c9385;transition:color .25s, transform .25s}
  nav button .idx{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:#5e564c;width:26px}
  nav button:hover{color:#efe6d6;transform:translateX(6px)}
  nav button:hover .idx{color:var(--red-bright)}
  nav button small{font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:#5f574d}
  .foot{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;color:#5c544a;line-height:2.1}
  .foot b{color:#7e7466;font-weight:400}
  .menuright{flex:1;position:relative;overflow:hidden}
  .menuright img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;
    filter:grayscale(.35) contrast(1.05) brightness(.72)}
  .menuright:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505 0%,rgba(5,5,5,.12) 34%,rgba(5,5,5,.28) 100%)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #hud.on{opacity:1}
  #reticle{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
    background:rgba(232,222,204,.5);box-shadow:0 0 6px rgba(0,0,0,.8);transition:all .2s}
  #reticle.hot{width:9px;height:9px;margin:-4.5px;background:rgba(206,58,44,.9);box-shadow:0 0 12px rgba(200,50,40,.5)}
  #prompt{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);
    font-family:var(--serif);font-size:15px;letter-spacing:.22em;color:#ded3c0;opacity:0;transition:opacity .25s;
    text-shadow:0 2px 10px #000; white-space:nowrap}
  #prompt.on{opacity:1}
  #prompt .key{display:inline-block;border:1px solid rgba(220,205,180,.45);border-radius:3px;
    padding:1px 7px;margin-right:9px;font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:#cbbfa8}
  #objective{position:absolute;left:4.2vw;top:8vh;font-family:var(--serif);font-size:15px;letter-spacing:.28em;
    color:#bcb1a0;text-shadow:0 2px 12px #000;opacity:0;transition:opacity 1.4s;line-height:2}
  #objective.on{opacity:.92}
  #objective .rule{display:block;width:26px;height:1px;background:#7d2a23;margin:9px 0 11px}
  #subtitle{position:absolute;left:50%;bottom:11vh;transform:translateX(-50%);max-width:70vw;text-align:center;
    font-family:var(--serif);font-size:17px;line-height:1.9;letter-spacing:.16em;color:#e2d8c6;
    text-shadow:0 2px 14px #000,0 0 30px #000;opacity:0;transition:opacity .6s}
  #subtitle.on{opacity:1}
  #roomname{position:absolute;right:4.4vw;bottom:6vh;font-family:var(--serif);font-size:12px;letter-spacing:.42em;
    color:#8d8474;text-shadow:0 2px 10px #000;opacity:.0;transition:opacity 1.6s}
  #roomname.on{opacity:.75}
  #paused{position:fixed;inset:0;z-index:30;background:rgba(2,2,2,.82);display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:26px;backdrop-filter:blur(3px)}
  #paused.on{display:flex}
  #paused h2{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:.5em;color:#d9cfbe;margin-left:.5em}
  #paused .row{display:flex;gap:34px}
  #paused button{all:unset;cursor:pointer;font-family:var(--serif);font-size:16px;letter-spacing:.3em;color:#968c7c;padding:8px 4px}
  #paused button:hover{color:#e9dfcd}

  /* ---------- loading / cinematic ---------- */
  #boot{position:fixed;inset:0;z-index:40;background:#050505;display:flex;align-items:center;justify-content:center;
    transition:opacity 1.1s;color:#8d8272;font-family:var(--serif);letter-spacing:.6em;font-size:12px}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .bar{position:absolute;left:50%;bottom:22vh;transform:translateX(-50%);width:220px;height:1px;background:#2a2521}
  #boot .bar i{display:block;height:100%;width:0%;background:#a33a2f;transition:width .4s}
  #letterbox div{position:fixed;left:0;right:0;height:0;background:#000;z-index:12;transition:height 1.1s cubic-bezier(.4,0,.2,1);pointer-events:none}
  #letterbox .top{top:0} #letterbox .bot{bottom:0}
  #letterbox.on .top{height:11vh} #letterbox.on .bot{height:11vh}
  #pvtitle{position:fixed;left:0;right:0;bottom:17vh;z-index:13;text-align:center;pointer-events:none;
    opacity:0;transition:opacity 1.4s}
  #pvtitle.on{opacity:1}
  #pvtitle .zh{font-family:var(--serif);font-size:clamp(28px,3.4vw,52px);letter-spacing:.34em;color:#e4dac8;margin-left:.34em}
  #pvtitle .en{font-family:var(--sans);font-size:10px;letter-spacing:.55em;color:#8d8172;margin-top:14px;margin-left:.55em}
  #pvtitle .rule{width:1px;height:34px;background:#7e2a22;margin:0 auto 18px}
  #fade{position:fixed;inset:0;z-index:11;background:#000;pointer-events:none;opacity:0;transition:opacity .8s}
  #endcard{position:fixed;inset:0;z-index:14;background:#000;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;text-align:center}
  #endcard.on{display:flex}
  #endcard .zh{font-family:var(--serif);font-size:clamp(40px,5vw,74px);letter-spacing:.4em;color:#d9cfbe;margin-left:.4em}
  #endcard .en{font-family:var(--sans);font-size:10px;letter-spacing:.6em;color:#6e6558;margin-left:.6em}
  #endcard .hint{font-family:var(--serif);font-size:13px;letter-spacing:.3em;color:#5c544a;margin-top:40px}
  #perf{position:fixed;right:8px;top:6px;z-index:15;font:10px/1.5 monospace;color:#6f6;opacity:0;pointer-events:none;white-space:pre}
  #perf.on{opacity:.75}
  .clickhint{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);z-index:9;font-size:11px;letter-spacing:.3em;
    color:#9b9081;opacity:0;transition:opacity .5s;pointer-events:none}
  .clickhint.on{opacity:.8}
</style>
</head>
<body>
<div id="app"></div>
<div id="grade"></div>
<div id="grain"></div>

<div id="hud">
  <div id="reticle"></div>
  <div id="prompt"></div>
  <div id="objective"><span class="rule"></span><span id="objtext"></span></div>
  <div id="subtitle"></div>
  <div id="roomname"></div>
</div>
<div class="clickhint" id="clickhint">點擊畫面 · 滑鼠環視</div>

<div id="menu">
  <div class="left">
    <div class="titlewrap">
      <div class="vtitle">回南</div>
      <div class="titlemeta">
        <div class="en">HUI NAM</div>
        <div class="rule"></div>
        <div class="sub">唐樓 · 一九八七<br><b>三樓，有人等緊你。</b></div>
      </div>
    </div>
    <nav>
      <button data-act="play"><span class="idx">01</span>開始 <small>ENTER</small></button>
      <button data-act="pv"><span class="idx">02</span>宣傳片 <small>TRAILER</small></button>
      <button data-act="quality"><span class="idx">03</span>畫質 <small id="qlabel">高</small></button>
      <button data-act="help"><span class="idx">04</span>操作 <small>CONTROLS</small></button>
    </nav>
    <div class="foot">
      <b>WASD</b> 移動 · <b>SHIFT</b> 快走 · <b>F</b> 電筒 · <b>E</b> 互動 · <b>ESC</b> 暫停<br>
      建議佩戴耳機 · 本作含閃爍光源與驚嚇內容
    </div>
  </div>
  <div class="menuright">
    <img id="menuart" alt="">
  </div>
</div>

<div id="paused">
  <h2>暫停</h2>
  <div class="row">
    <button data-act="resume">繼續</button>
    <button data-act="menu">返回主目錄</button>
  </div>
</div>

<div id="letterbox"><div class="top"></div><div class="bot"></div></div>
<div id="pvtitle"><div class="rule"></div><div class="zh"></div><div class="en"></div></div>
<div id="fade"></div>
<div id="endcard">
  <div class="zh">回南</div>
  <div class="en">HUI NAM — A HONG KONG TENEMENT STORY</div>
  <div class="hint">按 ESC 返回</div>
</div>
<div id="perf"></div>
<div id="boot"><span>正在進入唐樓</span><div class="bar"><i></i></div></div>

<script src="dist/bundle.js"></script>
</body>
</html>
